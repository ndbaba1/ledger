databases:
  - name: ledger-db
    plan: basic-256mb # not free: the free plan's database is deleted after 30 days

services:
  - type: web
    name: ledger
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /up
    preDeployCommand: bin/rails db:prepare
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ledger-db
          property: connectionString
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: "1"
      - key: RAILS_SERVE_STATIC_FILES
        value: "1"
      # Runs the Solid Queue supervisor inside this same Puma process (see
      # api/config/puma.rb) — there's no separate worker service, so without
      # this, enqueued jobs (e.g. DraftFromSourceJob) would never run.
      - key: SOLID_QUEUE_IN_PUMA
        value: "1"
      # Secrets and per-deploy settings — set these in the Render dashboard
      # after the first deploy. See README "Deploying".
      - key: SECRET_KEY_BASE
        sync: false
      - key: APP_URL
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_SLUG
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY_BASE64
        sync: false
      - key: GITHUB_APP_WEBHOOK_SECRET
        sync: false
      - key: ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
        sync: false
      - key: ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
        sync: false
      - key: ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        sync: false
